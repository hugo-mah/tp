apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: taskmanager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: taskmanager
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: redis-sa
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          # Redis doit démarrer avec un mot de passe.
          # redis-server accepte l'option --requirepass directement en argument.
          # La variable d'environnement ci-dessous permet de l'injecter sans l'écrire en clair.
          command: ["redis-server"]
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"    # fait référence à la variable d'env définie ci-dessous
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379

          securityContext:
            allowPrivilegeEscalation: false
          
          livenessProbe:
            # Redis ne propose pas d'endpoint HTTP.
            # Utilisez une probe de type exec avec redis-cli.
            # Indice : sh -c "redis-cli -a $REDIS_PASSWORD ping"
            exec:
              command:
                - "sh"
                - "-c"
                - "redis-cli -a \"$REDIS_PASSWORD\" ping"
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "redis-cli -a \"$REDIS_PASSWORD\" ping"
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: taskmanager
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
